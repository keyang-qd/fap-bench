[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fapbench"
version = "0.2.0"
description = "A reproducible benchmark suite for federated asset pricing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "PyYAML>=6.0",
  "matplotlib>=3.7"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fapbench*"]
