# Does RQ3's data-level effect survive the investable universe?
#
# Why this exists
# ---------------
# Table 3's reference protocol is the investable universe (microcaps excluded),
# because most of the unrestricted universe's predictability sits in the microcap
# segment. RQ3, however, was measured on the unrestricted universe: the
# heterogeneity grid predates that change and re-running all of it is ~200 cells.
#
# That leaves the paper's central contribution measured on the universe it
# elsewhere argues overstates results. The defence is sound -- each RQ3 contrast
# is a treatment-minus-matched-control difference *within* one universe, so the
# screen cancels inside the contrast -- but it is an argument, not evidence.
#
# This grid supplies the evidence for the single largest effect: severe feature
# heterogeneity, where FedAvg's dispersion effect is 0.0199 on the unrestricted
# universe. If a comparable effect appears here, the objection is closed for the
# effect that carries the claim. If it does not, that is a real scope limit and
# the manuscript must say so -- which is the point of running it.
#
# Design
# ------
# Exactly the pair from configs/icaif_heterogeneity.yaml, with ONE thing changed:
# the universe filter. Both the feature_heterogeneity block and the seed list are
# copied verbatim, so the only difference from the published contrast is the
# screen. If icaif_heterogeneity.yaml's severe settings are ever edited, edit
# these to match or the comparison stops being like-for-like.
#
# The universe_filter block is copied verbatim from ff12_exclude_microcaps in
# configs/icaif_core.yaml, so "investable" means the same thing here as in
# Table 3.
#
# 2 scenarios x 10 seeds = 20 cells. Ten seeds rather than the heterogeneity
# grid's twenty because inference is over the 60 test months (seeds reduce
# estimation noise, they are not independent draws), and this is a confirmation
# of an already-estimated contrast rather than a new estimate. Note the
# comparison against the published 20-seed number therefore uses different seed
# sets, the same caveat the manuscript already states for the unmatched ratios.
#
# Run:
#   caffeinate -dims python -u scripts/run_grid.py --grid configs/icaif_rq3_investable.yaml
#
# Then analyse with fapbench.robustness.capacity_separation_contrasts's estimator
# (seed_averaged_dispersion_contrasts) pointed at this phase, and compare the
# effect against the 0.0199 / 0.0163 / 0.0053 column of
# paper_tables/matched_control_dispersion_monthly.csv.

base_config: crsp_compustat_profitability.yaml
output_dir: outputs/icaif_publication/rq3_investable
continue_on_error: false
preload_panel_once: true
resume_completed: true

base_overrides:
  # Copied from icaif_heterogeneity.yaml. centralized_masked is required: it is
  # the baseline that separates information removal from federated coordination,
  # and the feature scenarios report it in place of plain centralized.
  baselines:
    centralized: true
    centralized_masked: true
    local: false
  federated:
    algorithms: [fedavg, scaffold, fedadam]
    server_lr: 0.003
  # The investable universe, verbatim from ff12_exclude_microcaps.
  universe_filter:
    enabled: true
    price_col: prc
    min_abs_price: 5.0
    market_cap_col: me
    exclude_bottom_market_cap_fraction: 0.2
    breakpoint_exchange_col: exchcd
    breakpoint_exchange_values: [1]

grid_execution:
  # 2 concurrent cells; raise only when this grid has the machine to itself.
  parallel_runs: 2
  max_total_client_workers: 6
  max_total_torch_threads: 6
  start_method: spawn
  parallel_child_console: false

child_logging:
  console: true
  round_interval: 5
  epoch_interval: 5

seeds: [11, 22, 33, 44, 55, 66, 77, 88, 99, 110]

scenarios:
  # Both blocks copied verbatim from icaif_heterogeneity.yaml's severe pair;
  # shared_private_selection is the only difference between them, exactly as in
  # the published contrast.
  - name: feature_heterogeneity_severe
    overrides:
      feature_heterogeneity: {enabled: true, common_fraction: 0.15, private_fraction: 0.35, shared_private_selection: false}
  - name: feature_heterogeneity_severe_matched
    overrides:
      feature_heterogeneity: {enabled: true, common_fraction: 0.15, private_fraction: 0.35, shared_private_selection: true}
