base_config: crsp_compustat_profitability.yaml
output_dir: outputs/icaif_publication/core
continue_on_error: false
preload_panel_once: true
resume_completed: true
grid_execution:
  parallel_runs: 1
  max_total_client_workers: 4
  max_total_torch_threads: 4
  start_method: spawn
  parallel_child_console: false
child_logging:
  console: true
  round_interval: 5
  epoch_interval: 5
  local_client_interval: 3
  prediction_client_interval: 3
# Raised from 5 to 10 seeds: this grid underlies the RQ1 method-ranking
# claims (Table 1), where cross-seed standard deviations are comparable in
# size to the between-method gaps at n=5.
seeds: [11, 22, 33, 44, 55, 66, 77, 88, 99, 110]
scenarios:
  - name: ff12_full_participation
    overrides:
      federated: {rounds: 50, participation_rate: 1.0, local_epochs: 1, server_lr: 0.003}
  - name: ff12_half_participation
    overrides:
      federated: {rounds: 50, participation_rate: 0.5, local_epochs: 1, server_lr: 0.003}
  - name: ff12_more_local_steps
    overrides:
      federated: {rounds: 10, participation_rate: 1.0, local_epochs: 5, server_lr: 0.003}
  - name: ff12_price_above_5
    overrides:
      universe_filter:
        enabled: true
        price_col: prc
        min_abs_price: 5.0
        exclude_bottom_market_cap_fraction: 0.0
      federated: {server_lr: 0.003}
  - name: ff12_exclude_microcaps
    overrides:
      universe_filter:
        enabled: true
        price_col: prc
        min_abs_price: 5.0
        market_cap_col: me
        exclude_bottom_market_cap_fraction: 0.2
        breakpoint_exchange_col: exchcd
        breakpoint_exchange_values: [1]
      federated: {server_lr: 0.003}
  # Investable universe at the low-communication budget. Needed because the
  # headline table reports the investable universe at BOTH local-computation
  # budgets: ff12_exclude_microcaps inherits the default 50 rounds x 1 epoch,
  # so without this cell the two budgets could only be compared on the
  # microcap-inclusive panel. Universe filter is copied verbatim from
  # ff12_exclude_microcaps and the budget verbatim from ff12_more_local_steps;
  # if either is edited, edit this one to match or the blocks stop being
  # comparable. 10 seeds = 10 new cells; the other 50 runs are reused.
  - name: ff12_exclude_microcaps_more_local_steps
    overrides:
      universe_filter:
        enabled: true
        price_col: prc
        min_abs_price: 5.0
        market_cap_col: me
        exclude_bottom_market_cap_fraction: 0.2
        breakpoint_exchange_col: exchcd
        breakpoint_exchange_values: [1]
      federated: {rounds: 10, participation_rate: 1.0, local_epochs: 5, server_lr: 0.003}
