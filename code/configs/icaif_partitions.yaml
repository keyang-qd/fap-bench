base_config: crsp_compustat_profitability.yaml
output_dir: outputs/icaif_publication/partitions
continue_on_error: false
preload_panel_once: true
resume_completed: true
base_overrides:
  partition_common_universe:
    enabled: true
    required_columns: [sic, exchcd, me]
    finite_numeric_columns: [sic, exchcd, me]
    positive_columns: [me]
    ff12_sic_col: sic
  baselines:
    centralized: true
    centralized_masked: false
    local: false
  federated:
    algorithms: [fedavg, scaffold, fedadam]
    server_lr: 0.003
grid_execution:
  parallel_runs: 1
  max_total_client_workers: 4
  max_total_torch_threads: 4
  start_method: spawn
  parallel_child_console: false
child_logging:
  console: true
  round_interval: 5
  epoch_interval: 5
  prediction_client_interval: 3
seeds: [11, 22, 33, 44, 55]
scenarios:
  - name: common_partition_ff12
    overrides:
      partition:
        type: domain
        domain_col: sic
        transform: ff12
        output_col: ff12
        drop_missing_domain: true
        missing_policy: error
        persistent_entity: false
  - name: common_partition_iid_12
    overrides:
      partition: {type: iid, num_clients: 12}
  - name: common_partition_exchange
    overrides:
      partition:
        type: domain
        domain_col: exchcd
        transform: none
        max_clients: null
        continuous_bins: null
        drop_missing_domain: true
        missing_policy: error
        persistent_entity: true
  - name: common_partition_size_quintile
    overrides:
      partition:
        type: domain
        domain_col: me
        transform: none
        continuous_bins: 5
        max_clients: null
        drop_missing_domain: true
        missing_policy: error
        persistent_entity: false
  # Higher-cardinality partition (up to 30 clients, vs. FF12's 12) using
  # two-digit SIC major groups instead of a named industry crosswalk, to test
  # whether conclusions depend on client granularity/count. See
  # sic_major_group() in fapbench/partition/industry.py for why this was used
  # instead of the Fama-French 48-industry classification.
  - name: common_partition_sic_major_group
    overrides:
      partition:
        type: domain
        domain_col: sic
        transform: sic_major_group
        output_col: sic_major_group
        max_clients: 30
        drop_missing_domain: true
        missing_policy: error
        persistent_entity: false
