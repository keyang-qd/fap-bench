# The FedAdam server-rate sweep, repeated on the WIDENED panel.
#
# Why this grid exists
# --------------------
# The widened cell is the one place in the paper where anything clears its own
# detectable gap, and what clears it is the distance between aggregation rules:
# FedAdam sits 0.52 of net Sharpe above FedAvg and SCAFFOLD. The manuscript
# argued that reading is conservative, because FedAdam's server rate was chosen
# on the SEVEN-characteristic panel and never re-selected here, so the winning
# arm carries the untuned hyperparameter.
#
# A reviewer refused that argument, correctly: an untuned rate can land near the
# optimum by luck just as easily as it can be handicapped, and "conservative" is
# an assumption until the sweep is run. This runs it. Same four candidate rates
# as the reference-panel sweep, same five seeds, same validation-only selection
# rule -- so if 0.003 turns out to be near the top of the curve on 20
# characteristics, the conservatism claim is withdrawn rather than defended.
#
# Validation-only by construction: baselines are off and the selection metric is
# validation Rank IC, so nothing here can touch a reported economic number. That
# is the same discipline the reference-panel sweep used and the reason this can
# be run after the headline result without contaminating it.
base_config: crsp_compustat_profitability_expanded.yaml
output_dir: outputs/icaif_publication/fedadam_validation_tuned20
continue_on_error: false
preload_panel_once: true
resume_completed: true
base_overrides:
  baselines:
    centralized: false
    centralized_masked: false
    local: false
  federated:
    algorithms: [fedadam]
    client_lr: 0.01
  # The widened cell's universe and architecture, so the sweep is run in the
  # configuration whose claim it is testing rather than in a neighbouring one.
  universe_filter:
    enabled: true
    price_col: prc
    min_abs_price: 5.0
    market_cap_col: me
    exclude_bottom_market_cap_fraction: 0.2
    breakpoint_exchange_col: exchcd
    breakpoint_exchange_values: [1]
  model:
    hidden_dims: [128, 64]
  evaluation:
    validation_prediction_calibration:
      enabled: true
      methods: [fedadam]
grid_execution:
  # Two concurrent runs: the linear 408-month grid holds the rest of the machine.
  parallel_runs: 2
  max_total_client_workers: 4
  max_total_torch_threads: 4
  start_method: spawn
  parallel_child_console: false
child_logging:
  console: true
  round_interval: 5
seeds: [11, 22, 33, 44, 55]
scenarios:
  - name: fedadam_validation_lr_0_001
    overrides: {federated: {server_lr: 0.001}}
  - name: fedadam_validation_lr_0_003
    overrides: {federated: {server_lr: 0.003}}
  - name: fedadam_validation_lr_0_01
    overrides: {federated: {server_lr: 0.01}}
  - name: fedadam_validation_lr_0_03
    overrides: {federated: {server_lr: 0.03}}
