seed: 42
device: cpu
torch_num_threads: 1
output_dir: outputs/crsp_compustat_profitability

data:
  path: /path/to/full_profitability_panel.parquet
  source_profile: crsp_compustat_profitability_v1
  date_col: date
  entity_col: permno
  target_col: retadj_1mn
  target_shift_months: 0
  split_date_col: target_date
  require_unique_entity_month: true
  feature_columns:
    - gpoa_zscore
    - roa_zscore
    - roe_zscore
    - roic_zscore
    - opoa_zscore
    - gmar_zscore
    - fcfoa_zscore
    - profitability_simple
  # These variables are already cross-sectionally ranked and z-scored by month.
  scaling: none

split:
  train_end: 2014-12-31
  val_end: 2018-12-31

partition:
  type: domain
  # Keep SIC in data_recipe2 and derive sic2 = floor(sic / 100).
  domain_col: sic2
  max_clients: 12
  persistent_entity: true

feature_heterogeneity:
  enabled: false
  common_fraction: 1.0
  private_fraction: 0.5

model:
  hidden_dims: [64, 32]
  dropout: 0.1
  batch_norm: false

baselines:
  centralized: true
  local: true
  epochs: 10

federated:
  algorithms: [fedavg, fedprox, scaffold, fedadam]
  rounds: 50
  local_epochs: 1
  batch_size: 2048
  client_lr: 0.001
  weight_decay: 0.0001
  proximal_mu: 0.01
  participation_rate: 1.0
  server_lr: 0.01
  server_beta1: 0.9
  server_beta2: 0.99
  server_tau: 1.0e-8

evaluation:
  portfolio_quantile: 0.1
  transaction_cost_bps: 10
  periods_per_year: 12
