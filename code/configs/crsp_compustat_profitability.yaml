seed: 42
device: cpu
torch_num_threads: 4
torch_num_interop_threads: 1
performance:
  cache_client_arrays: true
  parallel_clients: 4
  multiprocessing_start_method: spawn
  worker_torch_threads: 1
  prediction_batch_size: 65536
output_dir: outputs/crsp_compustat_profitability
data:
  path: /Users/keyang/qdata/data0712.parquet
  source_profile: crsp_compustat_profitability_v2
  date_col: formation_date
  entity_col: permno
  target_col: retadj_1mn
  target_shift_months: 0
  target_date_col: target_date
  target_period_col: target_year_month
  require_unique_entity_month: true
  validate_target_alignment: true
  feature_columns:
  - gpoa_zscore
  - roa_zscore
  - roe_zscore
  - roic_zscore
  - opoa_zscore
  - gmar_zscore
  - fcfoa_zscore
  scaling: none
split:
  date_col: target_date
  train_end: 2014-12-31
  val_end: 2018-12-31
universe_filter:
  enabled: false
  price_col: prc
  min_abs_price: null
  market_cap_col: me
  exclude_bottom_market_cap_fraction: 0.0
  breakpoint_exchange_col: null
  breakpoint_exchange_values:
  - 1
  min_stocks_per_month: 0
partition:
  type: domain
  domain_col: sic
  transform: ff12
  output_col: ff12
  drop_missing_domain: true
  missing_domain_label: MissingSIC
  persistent_entity: false
partition_common_universe:
  enabled: false
  required_columns:
  - sic
  - exchcd
  - me
  finite_numeric_columns:
  - sic
  - exchcd
  - me
  positive_columns:
  - me
  ff12_sic_col: sic
feature_heterogeneity:
  enabled: false
  common_fraction: 1.0
  private_fraction: 0.5
statistical_heterogeneity:
  enabled: false
  client_size_imbalance:
    enabled: false
    imbalance_ratio: 5.0
    min_entities_per_client: 1
  client_size_matched_control:
    enabled: false
    matched_imbalance_ratio: 20.0
    min_entities_per_client: 1
  label_skew:
    enabled: false
    n_bins: 5
    concentration: 1.0
    retain_fraction: 0.7
  covariate_shift:
    enabled: false
    location_std: 0.25
    log_scale_std: 0.15
temporal_heterogeneity:
  enabled: false
  mode: persistent
  min_availability: 0.25
  max_availability: 1.0
  block_fraction: 0.35
  matched_reference:
    mode: persistent
    min_availability: 0.25
    max_availability: 1.0
    block_fraction: 0.35
model:
  hidden_dims:
  - 64
  - 32
  dropout: 0.1
  batch_norm: false
baselines:
  centralized: true
  centralized_masked: true
  local: true
  match_federated_local_passes: true
  epochs: null
model_selection:
  enabled: true
  metric: rank_ic
  mode: max
  evaluate_every: 5
  report_selected_validation_metrics: true
federated:
  algorithms:
  - fedavg
  - fedprox
  - scaffold
  - fedadam
  rounds: 50
  local_epochs: 1
  batch_size: 2048
  client_optimizer: sgd
  client_momentum: 0.0
  client_lr: 0.01
  weight_decay: 0.0001
  proximal_mu: 0.01
  participation_rate: 1.0
  server_lr: 0.003
  server_beta1: 0.9
  server_beta2: 0.99
  server_tau: 1.0e-08
  server_lr_selection:
    scope: validation_only
    metric: validation_selected_rank_ic
    constraint_metric: validation_selected_oos_r2_zero
    constraint_min: -0.05
    selected_value: 0.003
evaluation:
  date_col: target_date
  client_col: client_id
  portfolio_quantile: 0.1
  transaction_cost_bps: 10
  periods_per_year: 12
  primary_portfolio: client_neutral
  local_global_score_calibration: percentile
  report_uncalibrated_local_global: true
  validation_prediction_calibration:
    enabled: true
    methods:
    - fedadam
    nonnegative_slope: true
    ridge: 1.0e-12
    method_suffix: calibrated
logging:
  level: INFO
  file: run.log
  console: true
  overwrite: false
  epoch_interval: 1
  local_client_interval: 1
  prediction_client_interval: 1
  round_interval: 1
  federated_client_details: false
  federated_client_interval: 1
  federated_local_epoch_interval: 0
  local_epoch_interval: 0
