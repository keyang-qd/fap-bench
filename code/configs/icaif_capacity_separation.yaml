# Does the data-level / system-level separation survive a higher-capacity model?
#
# R1 W1 calls this "the load-bearing robustness check", and it is NOT answered by
# the `wide_mlp` scenario in configs/icaif_robustness.yaml: that one only widens
# the model under the *reference* protocol, so it shows whether method rankings
# move with capacity, not whether the matched-control separation does.
#
# The concern is specific: if the 2,625-parameter MLP converges to nearly the
# same point regardless of update schedule, then "system-level heterogeneity has
# a small footprint" may be a statement about model capacity rather than about
# federated learning. Answering it requires re-running matched-control *pairs*
# at higher capacity and re-measuring the contrast.
#
# Three pairs, chosen to span the claim rather than to be exhaustive:
#   - feature_heterogeneity_severe  : largest data-level effect (0.0199, FedAvg)
#   - covariate_shift_strong        : other data-level family (0.0131, FedAvg)
#   - temporal_block_outages        : largest system-level effect (0.0020, SCAFFOLD)
# If the separation is real, the first two should stay an order of magnitude
# above the third at [256,128] just as they do at [64,32].
#
# 6 scenarios x 10 seeds = 60 cells. Ten seeds rather than twenty because the
# inference is over the 60 test months (seeds only reduce estimation noise), and
# because this is a robustness check on an already-estimated contrast.
#
# Analyse with seed_averaged_dispersion_contrasts, pointing the pair paths at
# this phase, then compare the effects against the same pairs in the main grids.
#
# Run:
#   caffeinate -dims python -u scripts/run_grid.py --grid configs/icaif_capacity_separation.yaml
#
base_config: crsp_compustat_profitability.yaml
output_dir: outputs/icaif_publication/capacity_separation
continue_on_error: false
preload_panel_once: true
resume_completed: true
grid_execution:
  parallel_runs: 2
  max_total_client_workers: 6
  max_total_torch_threads: 6
  start_method: spawn
  parallel_child_console: false
child_logging:
  console: true
  round_interval: 5
  epoch_interval: 5

base_overrides:
  # Wider network: ~35k parameters against the reference ~2.6k.
  model:
    hidden_dims: [256, 128]
    dropout: 0.1
    batch_norm: false
  # Only the three federated methods carry the contrast; the centralized and
  # local baselines are not needed and would triple the cost.
  baselines:
    centralized: false
    centralized_masked: false
    local: false
  federated:
    algorithms: [fedavg, scaffold, fedadam]

seeds: [11, 22, 33, 44, 55, 66, 77, 88, 99, 110]

scenarios:
  # --- data-level pair 1: feature availability, severe -----------------------
  - name: feature_heterogeneity_severe
    overrides:
      feature_heterogeneity:
        enabled: true
        common_fraction: 0.15
        private_fraction: 0.35
        shared_private_selection: false
      federated: {rounds: 50, participation_rate: 1.0, server_lr: 0.003}
  - name: feature_heterogeneity_severe_matched
    overrides:
      feature_heterogeneity:
        enabled: true
        common_fraction: 0.15
        private_fraction: 0.35
        shared_private_selection: true
      federated: {rounds: 50, participation_rate: 1.0, server_lr: 0.003}

  # --- data-level pair 2: covariate shift, strong ---------------------------
  - name: covariate_shift_strong
    overrides:
      statistical_heterogeneity:
        enabled: true
        client_size_imbalance: {enabled: false}
        client_size_matched_control: {enabled: false}
        label_skew: {enabled: false}
        covariate_shift: {enabled: true, location_std: 0.5, log_scale_std: 0.3}
        covariate_shift_matched_control: {enabled: false}
      federated: {rounds: 50, participation_rate: 1.0, server_lr: 0.003}
  - name: covariate_shift_strong_matched
    overrides:
      statistical_heterogeneity:
        enabled: true
        client_size_imbalance: {enabled: false}
        client_size_matched_control: {enabled: false}
        label_skew: {enabled: false}
        covariate_shift: {enabled: false}
        covariate_shift_matched_control:
          {enabled: true, location_std: 0.5, log_scale_std: 0.3}
      federated: {rounds: 50, participation_rate: 1.0, server_lr: 0.003}

  # --- system-level pair: block outages -------------------------------------
  - name: temporal_block_outages_identified
    overrides:
      temporal_heterogeneity: {enabled: true, mode: block, block_fraction: 0.40}
      federated: {rounds: 50, participation_rate: 1.0, server_lr: 0.003}
  - name: temporal_random_matched_block_outages
    overrides:
      temporal_heterogeneity:
        enabled: true
        mode: matched_random
        matched_reference: {mode: block, block_fraction: 0.40}
      federated: {rounds: 50, participation_rate: 1.0, server_lr: 0.003}
