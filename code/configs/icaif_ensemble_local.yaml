# Is federation better than just averaging the K local models?
#
# A reviewer's objection: the paper compares federated training against
# centralized training and against local-only training, but not against the
# obvious cheap alternative -- train locally, ship the K finished models once, and
# average their opinions. No rounds, no coordination, no shared optimizer state.
# If that matched federated training, the benchmark's central comparison would be
# far less interesting, so it has to be measured rather than argued away.
#
# Why a whole run rather than a post-hoc reconstruction
# ----------------------------------------------------
# The ensemble must aggregate the *same* local models the `local` row reports, or
# the two rows are not a decomposition of one training run and the comparison
# confounds aggregation with training. Enabling `ensemble_local` inside a run that
# also trains the local baseline guarantees that. Reconstructing it offline from
# the saved `local.pt` checkpoints would instead require replicating the runner's
# split, client-assignment, and preprocessing pipeline by hand -- a plausible
# wrong headline number is worse than no number.
#
# Why this grid and not the core grid
# -----------------------------------
# Turning `ensemble_local` on inside `icaif_core.yaml` would change
# `resolved_config.json` for all 60 core cells, so `resume_completed` would
# correctly refuse to reuse them and the whole grid would retrain (~13 min/run).
# Running the two scenarios that carry the comparison in their own grid costs 20
# runs instead of 60 and leaves the published core numbers untouched.
#
# Both scenarios keep the base `baselines` block intact and only ADD
# `ensemble_local`. That is deliberate: disabling centralized or the federated
# methods here would shift the RNG stream reaching local training, so the local
# models -- and therefore the ensemble -- would no longer be the ones the core
# grid trained. Every method is trained in the same run as the ensemble, which
# makes every contrast below exactly paired, with no cross-grid assumption.
#
# Cost: 2 scenarios x 10 seeds = 20 runs, ~13 min each, ~4h15m at parallel_runs=1.
base_config: crsp_compustat_profitability.yaml
output_dir: outputs/icaif_publication/ensemble_local
continue_on_error: false
preload_panel_once: true
resume_completed: true
grid_execution:
  parallel_runs: 1
  max_total_client_workers: 4
  max_total_torch_threads: 4
  start_method: spawn
  parallel_child_console: false
child_logging:
  console: true
  round_interval: 5
  epoch_interval: 5
  local_client_interval: 3
  prediction_client_interval: 3
# The same 10 seeds as `icaif_core.yaml`. Required, not cosmetic: the monthly
# contrast estimator averages the treatment-minus-comparison difference within
# each seed, so a different seed list would compare different market draws.
seeds: [11, 22, 33, 44, 55, 66, 77, 88, 99, 110]
base_overrides:
  baselines:
    ensemble_local: true
scenarios:
  # The reference protocol. Universe filter and federated block are copied
  # verbatim from `ff12_exclude_microcaps` in configs/icaif_core.yaml; if either
  # is edited there, edit it here or the two grids stop being comparable.
  - name: ff12_exclude_microcaps
    overrides:
      universe_filter:
        enabled: true
        price_col: prc
        min_abs_price: 5.0
        market_cap_col: me
        exclude_bottom_market_cap_fraction: 0.2
        breakpoint_exchange_col: exchcd
        breakpoint_exchange_values: [1]
      federated: {server_lr: 0.003}
  # The unrestricted universe, copied verbatim from `ff12_full_participation`.
  # Included because RQ2's own finding is that universe construction is the
  # largest lever in the benchmark, so an ensemble-versus-federation verdict that
  # held on only one universe would be exactly the kind of protocol-contingent
  # claim the paper warns against.
  - name: ff12_full_participation
    overrides:
      federated: {rounds: 50, participation_rate: 1.0, local_epochs: 1, server_lr: 0.003}
