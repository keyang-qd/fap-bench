base_config: crsp_compustat_profitability.yaml
output_dir: outputs/crsp_compustat_profitability_identification_grid
continue_on_error: true
preload_panel_once: true
resume_completed: true

grid_execution:
  parallel_runs: 1
  max_total_client_workers: 4
  max_total_torch_threads: 4
  start_method: spawn
  parallel_child_console: false

child_logging:
  console: true
  round_interval: 5
  epoch_interval: 5
  local_client_interval: 3
  prediction_client_interval: 3

seeds: [11, 22, 33, 44, 55]

scenarios:
  - name: identification_reference
    overrides:
      statistical_heterogeneity:
        enabled: false
      temporal_heterogeneity:
        enabled: false

  - name: size_uniform_matched_ratio_5
    overrides:
      statistical_heterogeneity:
        enabled: true
        client_size_matched_control:
          enabled: true
          matched_imbalance_ratio: 5.0
        client_size_imbalance:
          enabled: false
        label_skew:
          enabled: false
        covariate_shift:
          enabled: false

  - name: size_imbalance_ratio_5_identified
    overrides:
      statistical_heterogeneity:
        enabled: true
        client_size_matched_control:
          enabled: false
        client_size_imbalance:
          enabled: true
          imbalance_ratio: 5.0
        label_skew:
          enabled: false
        covariate_shift:
          enabled: false

  - name: size_uniform_matched_ratio_20
    overrides:
      statistical_heterogeneity:
        enabled: true
        client_size_matched_control:
          enabled: true
          matched_imbalance_ratio: 20.0
        client_size_imbalance:
          enabled: false
        label_skew:
          enabled: false
        covariate_shift:
          enabled: false

  - name: size_imbalance_ratio_20_identified
    overrides:
      statistical_heterogeneity:
        enabled: true
        client_size_matched_control:
          enabled: false
        client_size_imbalance:
          enabled: true
          imbalance_ratio: 20.0
        label_skew:
          enabled: false
        covariate_shift:
          enabled: false

  - name: temporal_persistent_mild_identified
    overrides:
      temporal_heterogeneity:
        enabled: true
        mode: persistent
        min_availability: 0.60
        max_availability: 1.00
      federated:
        participation_rate: 1.0

  - name: temporal_random_matched_persistent_mild
    overrides:
      temporal_heterogeneity:
        enabled: true
        mode: matched_random
        matched_reference:
          mode: persistent
          min_availability: 0.60
          max_availability: 1.00
      federated:
        participation_rate: 1.0

  - name: temporal_persistent_strong_identified
    overrides:
      temporal_heterogeneity:
        enabled: true
        mode: persistent
        min_availability: 0.10
        max_availability: 1.00
      federated:
        participation_rate: 1.0

  - name: temporal_random_matched_persistent_strong
    overrides:
      temporal_heterogeneity:
        enabled: true
        mode: matched_random
        matched_reference:
          mode: persistent
          min_availability: 0.10
          max_availability: 1.00
      federated:
        participation_rate: 1.0

  - name: temporal_block_outages_identified
    overrides:
      temporal_heterogeneity:
        enabled: true
        mode: block
        block_fraction: 0.40
      federated:
        participation_rate: 1.0

  - name: temporal_random_matched_block_outages
    overrides:
      temporal_heterogeneity:
        enabled: true
        mode: matched_random
        matched_reference:
          mode: block
          block_fraction: 0.40
      federated:
        participation_rate: 1.0
