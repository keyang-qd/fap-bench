# Tier 2 robustness check (EXPERIMENT_ENHANCEMENT_PLAN.md): re-runs the same
# five core scenarios as configs/icaif_core.yaml, but on the expanded
# 20-characteristic panel (see EXPANDED_CHARACTERISTIC_COMPONENTS in
# scripts/data_recipe2_revised.py) built via scripts/build_expanded_panel.py.
# Seeds match configs/icaif_core.yaml (10 seeds) rather than the original 5:
# per-seed Sharpe on this panel is noisy enough (std > mean at 5 seeds in the
# first expanded-panel run) that 5 seeds could not support a confident
# robustness claim -- see MANUSCRIPT_REVISION_PLAN.md section 5 in the paper
# repository.
base_config: crsp_compustat_profitability_expanded.yaml
output_dir: outputs/icaif_publication/core_expanded_features
continue_on_error: false
preload_panel_once: true
resume_completed: true
grid_execution:
  parallel_runs: 1
  max_total_client_workers: 4
  max_total_torch_threads: 4
  start_method: spawn
  parallel_child_console: false
child_logging:
  console: true
  round_interval: 5
  epoch_interval: 5
  local_client_interval: 3
  prediction_client_interval: 3
seeds: [11, 22, 33, 44, 55, 66, 77, 88, 99, 110]
scenarios:
  - name: ff12_full_participation
    overrides:
      federated: {rounds: 50, participation_rate: 1.0, local_epochs: 1, server_lr: 0.003}
  - name: ff12_half_participation
    overrides:
      federated: {rounds: 50, participation_rate: 0.5, local_epochs: 1, server_lr: 0.003}
  - name: ff12_more_local_steps
    overrides:
      federated: {rounds: 10, participation_rate: 1.0, local_epochs: 5, server_lr: 0.003}
  - name: ff12_price_above_5
    overrides:
      universe_filter:
        enabled: true
        price_col: prc
        min_abs_price: 5.0
        exclude_bottom_market_cap_fraction: 0.0
      federated: {server_lr: 0.003}
  - name: ff12_exclude_microcaps
    overrides:
      universe_filter:
        enabled: true
        price_col: prc
        min_abs_price: 5.0
        market_cap_col: me
        exclude_bottom_market_cap_fraction: 0.2
        breakpoint_exchange_col: exchcd
        breakpoint_exchange_values: [1]
      federated: {server_lr: 0.003}
