base_config: crsp_compustat_profitability.yaml
output_dir: outputs/crsp_compustat_profitability_fedadam_validation_grid
continue_on_error: true
preload_panel_once: true
resume_completed: true

base_overrides:
  baselines:
    centralized: false
    centralized_masked: false
    local: false
  model_selection:
    enabled: true
    metric: rank_ic
    mode: max
    evaluate_every: 5
    report_selected_validation_metrics: true
  federated:
    algorithms: [fedadam]
  evaluation:
    validation_prediction_calibration:
      enabled: true
      methods: [fedadam]
      nonnegative_slope: true
      ridge: 1.0e-12
      method_suffix: calibrated

grid_execution:
  parallel_runs: 1
  max_total_client_workers: 4
  max_total_torch_threads: 4
  start_method: spawn
  parallel_child_console: false

child_logging:
  console: true
  round_interval: 5
  prediction_client_interval: 3

seeds: [11, 22, 33, 44, 55]

scenarios:
  - name: fedadam_validation_lr_0_001
    overrides:
      federated:
        server_lr: 0.001

  - name: fedadam_validation_lr_0_003
    overrides:
      federated:
        server_lr: 0.003

  - name: fedadam_validation_lr_0_01
    overrides:
      federated:
        server_lr: 0.01

  - name: fedadam_validation_lr_0_03
    overrides:
      federated:
        server_lr: 0.03
