# Pipeline/performance smoke test only; not the final paper experiment.
base_config: crsp_compustat_profitability.yaml
output_dir: outputs/crsp_compustat_profitability_grid_quick
continue_on_error: false
preload_panel_once: true
resume_completed: true
child_logging:
  console: false
  round_interval: 1
  epoch_interval: 0
  local_client_interval: 0
  prediction_client_interval: 3
seeds: [11]

scenarios:
  - name: ff12_full_participation_quick
    overrides:
      baselines:
        centralized: false
        centralized_masked: false
        local: false
      federated:
        algorithms: [fedavg]
        rounds: 5
        participation_rate: 1.0
        local_epochs: 1

  - name: ff12_more_local_steps_quick
    overrides:
      baselines:
        centralized: false
        centralized_masked: false
        local: false
      federated:
        algorithms: [fedavg]
        rounds: 1
        participation_rate: 1.0
        local_epochs: 5
