base_config: synthetic_smoke.yaml
output_dir: outputs/synthetic_grid
seeds: [7]

scenarios:
  - name: iid_easy
    overrides:
      partition:
        type: iid
        num_clients: 6
      feature_heterogeneity:
        enabled: false
      federated:
        participation_rate: 1.0

  - name: sector_domain
    overrides:
      partition:
        type: domain
        domain_col: sic2
        max_clients: 6
      feature_heterogeneity:
        enabled: false
      federated:
        participation_rate: 1.0

  - name: feature_moderate
    overrides:
      partition:
        type: domain
        domain_col: sic2
        max_clients: 6
      feature_heterogeneity:
        enabled: true
        common_fraction: 0.5
        private_fraction: 0.5
      federated:
        participation_rate: 1.0

  - name: combined_severe
    overrides:
      partition:
        type: domain
        domain_col: sic2
        max_clients: 6
      feature_heterogeneity:
        enabled: true
        common_fraction: 0.2
        private_fraction: 0.4
      federated:
        participation_rate: 0.5

logging:
  level: INFO
  file: run.log
  console: true
  overwrite: false
  # Baselines: log every N epochs. Set 0 to suppress epoch-level logs.
  epoch_interval: 1
  # Local-only baseline: log every N clients.
  local_client_interval: 1
  # Predictions: log every N clients.
  prediction_client_interval: 1
  # Federated training: log every N communication rounds.
  round_interval: 1
  # Set true for per-client messages inside every FL round (very verbose).
  federated_client_details: false
  federated_client_interval: 1
  # Set >0 only when local epoch logs inside each FL client are needed.
  federated_local_epoch_interval: 0
  local_epoch_interval: 0
