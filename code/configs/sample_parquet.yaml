seed: 42
device: cpu
torch_num_threads: 1
output_dir: outputs/sample_run

data:
  path: /mnt/data/sample(1).parquet
  date_col: date
  entity_col: permno
  target_col: retadj_1mn
  # data_recipe2 defines retadj_1mn = retadj, so use an exact calendar t+1 target.
  target_shift_months: 1
  feature_columns:
    - gpoa_zscore
    - roa_zscore
    - roe_zscore
    - roic_zscore
    - opoa_zscore
    - gmar_zscore
    - fcfoa_zscore
    - profitability_simple
  scaling: none

split:
  ratios: [0.6, 0.2, 0.2]

partition:
  # The 10-row sample has one stock and cannot support actual FL training.
  # On the full dataset, use type: domain and domain_col: sic2/sector/naics.
  type: domain
  domain_col: exchcd
  max_clients: 10

feature_heterogeneity:
  enabled: false
  common_fraction: 1.0
  private_fraction: 0.5

model:
  hidden_dims: [64, 32]
  dropout: 0.1
  batch_norm: false

baselines:
  centralized: true
  local: true
  epochs: 5

federated:
  algorithms: [fedavg, fedprox, scaffold, fedadam]
  rounds: 20
  local_epochs: 1
  batch_size: 512
  client_lr: 0.001
  weight_decay: 0.0001
  proximal_mu: 0.01
  participation_rate: 1.0
  server_lr: 0.01
  server_beta1: 0.9
  server_beta2: 0.99
  server_tau: 1.0e-8

evaluation:
  portfolio_quantile: 0.1
  transaction_cost_bps: 10
  periods_per_year: 12
