# Reviewer-requested robustness grid (ICAIF revision, Tier 2 of reviews/REVISION_PLAN.md).
#
# Four independent checks, all reachable by configuration alone against the
# reference FF12 full-participation protocol:
#
#   1. linear / ridge baseline  (R1 W1, R2 3.5, Q11)
#      `model.hidden_dims: []` reduces AssetPricingMLP to a single output layer,
#      i.e. linear regression; `federated.weight_decay` supplies the L2 penalty,
#      making it ridge. Two penalties are swept so the baseline is tuned, not
#      strawmanned.
#
#   2. capacity check           (R1 W1 "the load-bearing robustness check", Q1)
#      A ~10x wider network. If the data-level / system-level separation is an
#      artifact of a 2,625-parameter model converging to the same point
#      regardless of update schedule, this is where it shows.
#
#   3. FedProx mu sweep         (R1 W5, Q4)
#      FedProx is currently numerically identical to FedAvg because mu is fixed
#      at 0.01 and never swept, which reads as a configuration error. Sweeping
#      mu either makes FedProx a genuine comparison or justifies dropping it.
#
#   4. transaction-cost sensitivity (R1 W10, R2 3.6, Q10)
#      10 bps is optimistic on a microcap-heavy universe, and the microcap
#      segment is exactly what drives measured predictability here.
#
# Run:
#   caffeinate -dims python -u scripts/run_grid.py --config configs/icaif_robustness.yaml
#
base_config: crsp_compustat_profitability.yaml
output_dir: outputs/icaif_publication/robustness
continue_on_error: false
preload_panel_once: true
resume_completed: true
grid_execution:
  parallel_runs: 2
  max_total_client_workers: 6
  max_total_torch_threads: 6
  start_method: spawn
  parallel_child_console: false
child_logging:
  console: true
  round_interval: 5
  epoch_interval: 5
  local_client_interval: 3
  prediction_client_interval: 3

# Ten seeds, matching the core grid these scenarios are compared against.
seeds: [11, 22, 33, 44, 55, 66, 77, 88, 99, 110]

scenarios:
  # --- 1. linear / ridge baselines ----------------------------------------
  - name: linear_ridge_weak
    overrides:
      model: {hidden_dims: [], dropout: 0.0, batch_norm: false}
      federated: {rounds: 50, participation_rate: 1.0, local_epochs: 1,
                  server_lr: 0.003, weight_decay: 0.0001}
  - name: linear_ridge_strong
    overrides:
      model: {hidden_dims: [], dropout: 0.0, batch_norm: false}
      federated: {rounds: 50, participation_rate: 1.0, local_epochs: 1,
                  server_lr: 0.003, weight_decay: 0.01}

  # --- 2. capacity check ---------------------------------------------------
  - name: wide_mlp
    overrides:
      model: {hidden_dims: [256, 128], dropout: 0.1, batch_norm: false}
      federated: {rounds: 50, participation_rate: 1.0, local_epochs: 1,
                  server_lr: 0.003}

  # --- 3. FedProx mu sweep -------------------------------------------------
  # mu=0.01 is the current (untuned) setting and is included so the sweep is
  # self-contained; mu=0 is FedAvg by construction and is omitted.
  - name: fedprox_mu_0_001
    overrides:
      federated: {rounds: 50, participation_rate: 1.0, local_epochs: 1,
                  server_lr: 0.003, proximal_mu: 0.001}
  - name: fedprox_mu_0_01
    overrides:
      federated: {rounds: 50, participation_rate: 1.0, local_epochs: 1,
                  server_lr: 0.003, proximal_mu: 0.01}
  - name: fedprox_mu_0_1
    overrides:
      federated: {rounds: 50, participation_rate: 1.0, local_epochs: 1,
                  server_lr: 0.003, proximal_mu: 0.1}
  - name: fedprox_mu_1_0
    overrides:
      federated: {rounds: 50, participation_rate: 1.0, local_epochs: 1,
                  server_lr: 0.003, proximal_mu: 1.0}

  # --- 5. tuned local-only baseline (R1 W6, R2 Q12) ------------------------
  # Local models currently inherit the federated client hyperparameters
  # (client_lr, weight_decay, optimizer, momentum) verbatim, so "federation
  # helps" is partly a statement about the budget-matching protocol. Here each
  # client selects its own (lr, weight_decay) on validation Rank IC; the
  # selections are written to local_selected_hyperparameters.csv per run.
  # Cost note: the 3x3 grid retrains the local baseline nine times per run, so
  # this scenario is the slowest in the grid. Federated training is unaffected.
  - name: local_tuned
    overrides:
      baselines:
        local_tuning:
          enabled: true
          learning_rates: [0.003, 0.01, 0.03]
          weight_decays: [0.0, 0.001, 0.01]
      federated: {rounds: 50, participation_rate: 1.0, local_epochs: 1,
                  server_lr: 0.003}

  # --- 4. transaction-cost sensitivity -------------------------------------
  # Identical training to ff12_full_participation; only the evaluation-side
  # cost changes, so these are cheap re-evaluations of the same protocol.
  - name: cost_25bps
    overrides:
      evaluation: {transaction_cost_bps: 25.0}
      federated: {rounds: 50, participation_rate: 1.0, local_epochs: 1,
                  server_lr: 0.003}
  - name: cost_50bps
    overrides:
      evaluation: {transaction_cost_bps: 50.0}
      federated: {rounds: 50, participation_rate: 1.0, local_epochs: 1,
                  server_lr: 0.003}
