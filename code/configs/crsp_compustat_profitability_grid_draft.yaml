# Full-method draft grid for iteration. It is materially smaller than the final
# 5-seed/50-round grid, but unlike grid_quick it runs every algorithm and baseline.
base_config: crsp_compustat_profitability.yaml
output_dir: outputs/crsp_compustat_profitability_grid_draft
continue_on_error: true
preload_panel_once: true
resume_completed: true
child_logging:
  console: true
  round_interval: 5
  epoch_interval: 5
  local_client_interval: 3
  prediction_client_interval: 3

# Three seeds and 20 full-budget passes are intended for iteration and table
# debugging. Use crsp_compustat_profitability_grid.yaml for the final 5-seed run.
seeds: [11, 22, 33]

scenarios:
  - name: ff12_full_participation
    overrides:
      federated:
        rounds: 20
        participation_rate: 1.0
        local_epochs: 1

  - name: ff12_half_participation
    overrides:
      federated:
        rounds: 20
        participation_rate: 0.5
        local_epochs: 1

  - name: ff12_more_local_steps
    overrides:
      federated:
        rounds: 4
        participation_rate: 1.0
        local_epochs: 5

  - name: ff12_price_above_5
    overrides:
      universe_filter:
        enabled: true
        price_col: prc
        min_abs_price: 5.0
        exclude_bottom_market_cap_fraction: 0.0
      federated:
        rounds: 20
        participation_rate: 1.0
        local_epochs: 1

  - name: ff12_exclude_microcaps
    overrides:
      universe_filter:
        enabled: true
        price_col: prc
        min_abs_price: 5.0
        market_cap_col: me
        exclude_bottom_market_cap_fraction: 0.2
        breakpoint_exchange_col: exchcd
        breakpoint_exchange_values: [1]
      federated:
        rounds: 20
        participation_rate: 1.0
        local_epochs: 1
