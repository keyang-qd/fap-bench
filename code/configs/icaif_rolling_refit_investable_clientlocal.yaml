# Federation-feasible preprocessing on the reference 408-month cell.
#
# Why this exists
# ---------------
# A reviewer's central objection: the benchmark's default within-month
# rank-then-z-score is taken over the whole cross-section BEFORE clients exist,
# which no real federation could compute. The paper concedes this and shows the
# feasible alternative matters a great deal -- Centralized keeps 91% of its Rank
# IC and FedAdam 97%, against 33-34% for FedAvg and SCAFFOLD -- but shows it only
# in the 60-month cell, which the same paper argues cannot rank methods
# economically. The paper cannot lean on a cell it has declared non-rankable to
# establish that the infeasible step does not overturn the 408-month results.
#
# This config reruns the reference cell with data.client_local_standardization
# enabled and nothing else changed: same panel, same universe filter, same
# arms, same budget, same 34 refit windows, same 10 seeds. The flag is honoured
# in fapbench.runner.run() after clients are formed and before the splits are
# taken, so every split sees the same transform.
#
# Cost when this was written: the global-standardization twin took 44.7
# training-hours over 2,040 runs.
base_config: crsp_compustat_profitability.yaml
output_dir: outputs/icaif_publication/rolling_refit_investable_clientlocal
continue_on_error: false
preload_panel_once: true
resume_completed: true
base_overrides:
  baselines:
    centralized_masked: false
  federated:
    algorithms:
    - fedavg
    - scaffold
    - fedadam
  universe_filter:
    enabled: true
    price_col: prc
    min_abs_price: 5.0
    market_cap_col: me
    exclude_bottom_market_cap_fraction: 0.2
    breakpoint_exchange_col: exchcd
    breakpoint_exchange_values:
    - 1
  data:
    client_local_standardization: true
grid_execution:
  parallel_runs: 3
  max_total_client_workers: 9
  max_total_torch_threads: 9
  start_method: spawn
  parallel_child_console: false
child_logging:
  console: true
  round_interval: 10
seeds:
- 11
- 22
- 33
- 44
- 55
- 66
- 77
- 88
- 99
- 110
scenarios:
- name: refit_test_1990
  overrides:
    split:
      train_end: '1985-12-31'
      val_end: '1989-12-31'
      test_end: '1990-12-31'
    federated:
      rounds: 50
      participation_rate: 1.0
      local_epochs: 1
      server_lr: 0.003
