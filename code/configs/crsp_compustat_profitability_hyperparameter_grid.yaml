base_config: crsp_compustat_profitability.yaml
output_dir: outputs/crsp_compustat_profitability_hyperparameter_grid
continue_on_error: true
preload_panel_once: true
resume_completed: true

grid_execution:
  # Hyperparameter cells do not repeat centralized/local baselines, so two
  # parallel runs are reasonable on a machine with enough RAM. Keep at 1 on a
  # laptop with memory pressure.
  parallel_runs: 1
  max_total_client_workers: 4
  max_total_torch_threads: 4
  start_method: spawn
  parallel_child_console: false

child_logging:
  console: true
  round_interval: 5
  epoch_interval: 0
  local_client_interval: 0
  prediction_client_interval: 3

seeds: [11, 22, 33, 44, 55]

scenarios:
  - name: fedprox_mu_0_001
    overrides:
      baselines:
        centralized: false
        centralized_masked: false
        local: false
      federated:
        algorithms: [fedprox]
        proximal_mu: 0.001

  - name: fedprox_mu_0_01
    overrides:
      baselines:
        centralized: false
        centralized_masked: false
        local: false
      federated:
        algorithms: [fedprox]
        proximal_mu: 0.01

  - name: fedprox_mu_0_1
    overrides:
      baselines:
        centralized: false
        centralized_masked: false
        local: false
      federated:
        algorithms: [fedprox]
        proximal_mu: 0.1

  - name: fedprox_mu_1_0
    overrides:
      baselines:
        centralized: false
        centralized_masked: false
        local: false
      federated:
        algorithms: [fedprox]
        proximal_mu: 1.0

  - name: fedadam_server_lr_0_001
    overrides:
      baselines:
        centralized: false
        centralized_masked: false
        local: false
      federated:
        algorithms: [fedadam]
        server_lr: 0.001

  - name: fedadam_server_lr_0_003
    overrides:
      baselines:
        centralized: false
        centralized_masked: false
        local: false
      federated:
        algorithms: [fedadam]
        server_lr: 0.003

  - name: fedadam_server_lr_0_01
    overrides:
      baselines:
        centralized: false
        centralized_masked: false
        local: false
      federated:
        algorithms: [fedadam]
        server_lr: 0.01

  - name: fedadam_server_lr_0_03
    overrides:
      baselines:
        centralized: false
        centralized_masked: false
        local: false
      federated:
        algorithms: [fedadam]
        server_lr: 0.03
